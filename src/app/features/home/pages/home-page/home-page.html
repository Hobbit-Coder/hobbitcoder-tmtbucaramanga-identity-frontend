<main class="mx-auto flex max-w-2xl flex-col gap-6 p-4">
  <header class="flex items-center justify-between gap-4">
    <h1 class="text-2xl font-medium">Mi cuenta</h1>
    <button mat-stroked-button type="button" (click)="logout()">Cerrar sesión</button>
  </header>

  <section aria-labelledby="profile-title">
    <h2 id="profile-title" class="text-lg font-medium">Perfil</h2>
    @if (user.isLoading()) {
      <p>Cargando tu perfil…</p>
    } @else if (user.error()) {
      <p role="alert">No fue posible cargar tu perfil.</p>
    } @else if (user.value(); as currentUser) {
      <p>{{ currentUser.firstName }} {{ currentUser.lastName }} · {{ currentUser.email }}</p>
      @if (roles()) {
        <p>Roles: {{ roles() }}</p>
      }
    }
  </section>
</main>
