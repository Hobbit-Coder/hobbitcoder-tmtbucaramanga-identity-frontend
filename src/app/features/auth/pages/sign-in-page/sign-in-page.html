<main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center gap-6 p-4">
  <h1 class="text-2xl font-medium">Iniciar sesión</h1>

  <form class="flex flex-col gap-2" [formRoot]="signInForm">
    <mat-form-field>
      <mat-label>Correo</mat-label>
      <input matInput type="email" autocomplete="username" [formField]="signInForm.email" />
      <mat-error>{{ signInForm.email().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        type="password"
        autocomplete="current-password"
        [formField]="signInForm.password"
      />
      <mat-error>{{ signInForm.password().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="error-message" role="alert">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="signInForm().submitting()">
      Iniciar sesión
    </button>
  </form>

  <p>
    ¿No tienes cuenta?
    <a routerLink="/auth/sign-up" [queryParams]="{ returnUrl: returnUrl() }">Crear una cuenta</a>
  </p>
</main>
