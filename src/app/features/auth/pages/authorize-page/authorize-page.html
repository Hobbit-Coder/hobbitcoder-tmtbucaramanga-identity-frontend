<main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center gap-4 p-4">
  @if (errorMessage(); as message) {
    <h1 class="text-2xl font-medium">No fue posible continuar</h1>
    <p class="error-message" role="alert">{{ message }}</p>
    <a routerLink="/">Ir a mi cuenta</a>
  } @else {
    <h1 class="text-2xl font-medium">Volviendo a la aplicación…</h1>
    <p role="status">Estamos confirmando tu sesión.</p>
  }
</main>
