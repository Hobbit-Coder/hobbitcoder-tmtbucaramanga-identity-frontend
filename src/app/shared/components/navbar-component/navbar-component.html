<header>
  <mat-toolbar class="gap-2">
    <button
      mat-icon-button
      type="button"
      aria-label="Abrir o cerrar el menú"
      (click)="menuToggle.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a routerLink="/" class="text-lg font-medium no-underline">Identity</a>

    <span class="flex-1"></span>

    <button mat-button type="button" aria-label="Cuenta del usuario" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span class="hidden sm:inline">{{ user()?.firstName }} {{ user()?.lastName }}</span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      @if (user(); as currentUser) {
        <p class="px-4 py-2 text-sm">{{ currentUser.email }}</p>
      }
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </mat-toolbar>
</header>
