<div class="flex h-dvh flex-col">
  <app-navbar-component (menuToggle)="sidenav.toggle()" />

  <mat-sidenav-container class="flex-1">
    <mat-sidenav
      #sidenav
      class="w-64"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="!isHandset()"
    >
      <app-sidebar-component (navigated)="isHandset() && sidenav.close()" />
    </mat-sidenav>

    <!-- Material fija display: block en el contenido: `flex!` lo reemplaza. -->
    <mat-sidenav-content class="flex! flex-col">
      <div class="flex-1">
        <router-outlet />
      </div>
      <app-footer-component />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
