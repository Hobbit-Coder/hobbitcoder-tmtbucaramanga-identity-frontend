# Scripts de instalación que pnpm 12 pide aprobar. Ninguno es necesario (igual que en el Dockerfile,
# que instala con --ignore-scripts): esbuild trae su binario como dependencia opcional y los demás son
# aceleradores con alternativa.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
