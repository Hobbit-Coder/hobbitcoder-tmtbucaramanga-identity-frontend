# SPA de Identity. Las cabeceras de seguridad se incluyen en cada location porque un add_header
# dentro de una location anula los de niveles superiores.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: nunca cambian, caché de un año.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rutas de la SPA: siempre index.html, sin caché para recibir cada despliegue.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
