# Mismas cabeceras que web.config, más la política de contenido (CSP).
# connect-src: el propio origen (la API de Identity en /api) y la API de Sheepfold, de la que el editor de
# usuarios lee las responsabilidades ministeriales (solo lectura, con token de audiencia Sheepfold).
# style-src 'unsafe-inline': Angular inserta los estilos de los componentes en <style>. No hay
# scripts inline: el CSS crítico no se inyecta con script (angular.json, inlineCritical: false).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sheepfold.tmtbucaramanga.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
